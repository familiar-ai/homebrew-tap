name: Announce Guv Release

on:
  push:
    branches: [main]
    paths: [Formula/guv.rb]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # ca-certificates 20260816ubuntu0.* drops the compromised eMudhra roots, so the Bearer token cannot go to a forged certificate.
      - name: Install patched Ubuntu ca-certificates
        run: |
          set -eu
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates
          dpkg --compare-versions "$(dpkg-query -W -f '${Version}' ca-certificates)" ge 20260816ubuntu0

      # The notifier posts each guv:<version> once, so a rerun or a formula-only edit does not post again.
      - name: Announce the formula's Guv release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTIFICATION_URL: ${{ vars.RELEASE_NOTIFICATION_URL }}
          RELEASE_NOTIFICATION_TOKEN: ${{ secrets.RELEASE_NOTIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_NOTIFICATION_URL"
          test -n "$RELEASE_NOTIFICATION_TOKEN"
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/guv.rb)
          test -n "$version"
          gh release view "guv-v$version" --repo "$GITHUB_REPOSITORY" --json url,body,isDraft,isPrerelease |
            jq --arg version "$version" '
              if .isDraft or .isPrerelease then error("guv-v\($version) is a draft or prerelease")
              elif (.body | test("\\S") | not) then error("guv-v\($version) has no release notes")
              else {product: "guv", version: $version, notes: .body, url: .url} end' \
              > "$RUNNER_TEMP/guv-release-notification.json"
          status=$(printf 'header = "Authorization: Bearer %s"\n' "$RELEASE_NOTIFICATION_TOKEN" |
            curl --config - --fail --silent --show-error --retry 3 \
              --connect-timeout 10 --max-time 30 --output /dev/null \
              --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data-binary @"$RUNNER_TEMP/guv-release-notification.json" \
              "$RELEASE_NOTIFICATION_URL")
          [[ "$status" == 2[0-9][0-9] ]] || { echo "Release notification failed (HTTP $status)" >&2; exit 1; }

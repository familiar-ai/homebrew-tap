name: Tap Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check formula if present
        run: |
          set -euo pipefail
          if [[ ! -f Formula/guv.rb ]]; then
            echo "Formula/guv.rb not published yet"
            exit 0
          fi
          brew tap familiar-ai/tap
          # Test this checkout's formula, including unmerged PR changes.
          cp Formula/guv.rb "$(brew --repository familiar-ai/tap)/Formula/guv.rb"
          brew install familiar-ai/tap/guv
          brew test familiar-ai/tap/guv
